[package]
name = "aws-cost-report"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "Show AWS costs by account and service for the current or recent months"
license = "MIT"
repository = "https://github.com/meslab/aws-cost-report"
readme = "README.md"
keywords = ["aws", "billing", "cost", "cli", "cost-explorer"]
categories = ["command-line-utilities"]
exclude = ["/.github"]

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.13.0", default-features = false, features = [
    "behavior-version-latest",
    "credentials-process",
    "legacy-client",
    "rt-tokio",
    "sso",
] }
aws-sdk-costexplorer = { version = "1.137.0", default-features = false, features = [
    "rt-tokio",
    "rustls",
] }
aws-sdk-organizations = { version = "1.136.0", default-features = false, features = [
    "rt-tokio",
    "rustls",
] }
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
